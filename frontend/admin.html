<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지식 도우미 관리자 리포트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { font-family: 'Malgun Gothic', system-ui, sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">지식 도우미 운영 리포트</h1>
      <p class="text-slate-500 mt-1">무엇을 묻는지, 무엇에 답 못 했는지 — 문서를 보강할 단서가 됩니다.</p>
    </header>
    <div id="cards" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6"></div>
    <div class="bg-white rounded-xl shadow-sm p-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">❓ 답 못 한 질문 (문서에 없어서 '자료에 없습니다'로 답한 질문)</h2>
      <div id="unanswered" class="space-y-2 text-sm"></div>
    </div>
  </div>
  <script>
    const API = 'http://localhost:3003/api';
    const card = (label, value, color) => `
      <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 ${color}">
        <div class="text-2xl font-bold text-slate-800">${value}</div>
        <div class="text-xs text-slate-500 mt-1 font-semibold">${label}</div>
      </div>`;
    (async () => {
      const s = await (await fetch(`${API}/stats`)).json();
      document.getElementById('cards').innerHTML =
        card('문서', s.docs + '개', 'border-teal-400') +
        card('색인 조각', s.chunks + '개', 'border-sky-400') +
        card('질문 수', s.totalQueries + '건', 'border-indigo-400') +
        card('답변율', s.answerRate + '%', 'border-emerald-400') +
        card('예상 비용', '₩' + s.estCostKrw, 'border-amber-400');
      const box = document.getElementById('unanswered');
      if (!s.unanswered.length) box.innerHTML = '<p class="text-slate-400">아직 없음 — 모든 질문에 답했습니다.</p>';
      else box.innerHTML = s.unanswered.map(q => `
        <div class="flex items-center gap-2 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2">
          <span class="text-rose-500">⚠️</span><span class="text-slate-700">${q}</span>
        </div>`).join('');
    })();
  </script>
</body>
</html>
